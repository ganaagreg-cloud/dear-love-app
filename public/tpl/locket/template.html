<style>
:root{
  --ink:#07060d; --cream:#f4ead6; --cream-dim:rgba(244,234,214,.62);
  --gold:#d9b46a; --gold-hi:#f6e3a8; --gold-lo:#8a6424;
  --rose:#d8283f; --thread:#ff3350;
  --serif:"Cormorant Garamond",Georgia,"Times New Roman",serif;
  --script:"Bad Script","Cormorant Garamond",cursive;
  --L:300px; --W:180px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:
    radial-gradient(120% 80% at 50% 115%, #1b2452 0%, #0d0f26 45%, #07060d 75%),
    #07060d;
  color:var(--cream); font-family:var(--serif); overflow:hidden;
  -webkit-font-smoothing:antialiased; user-select:none; -webkit-user-select:none;
  touch-action:none;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#sky{z-index:0}
#fx{z-index:6;pointer-events:none}

/* film grain + vignette */
.grain{position:fixed;inset:-50%;z-index:20;pointer-events:none;opacity:.07;mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  animation:grain 1s steps(6) infinite}
@keyframes grain{0%{transform:translate(0,0)}20%{transform:translate(-4%,3%)}40%{transform:translate(3%,-5%)}60%{transform:translate(-2%,6%)}80%{transform:translate(5%,1%)}100%{transform:translate(0,0)}}
.vignette{position:fixed;inset:0;z-index:19;pointer-events:none;
  background:radial-gradient(ellipse at 50% 45%,transparent 45%,rgba(0,0,0,.55) 100%)}

/* stage & scenes */
#stage{position:fixed;inset:0;z-index:5}
.scene{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
  padding:max(7vh,38px) 16px max(10vh,64px);gap:2vh;visibility:hidden;opacity:0;text-align:center}
.scene.active{visibility:visible}
.visual{position:relative;flex:1;width:100%;min-height:0}

.chapter{display:flex;flex-direction:column;align-items:center;gap:.6rem}
.chapter .num{font-size:.78rem;letter-spacing:.42em;text-transform:uppercase;color:var(--gold);display:flex;align-items:center;gap:14px;padding-left:.42em}
.chapter .num::before,.chapter .num::after{content:"";height:1px;width:42px;background:linear-gradient(90deg,transparent,var(--gold))}
.chapter .num::after{transform:scaleX(-1)}
.chapter h2{font-weight:300;font-style:italic;font-size:clamp(2rem,5vw,3.6rem);line-height:1.05;letter-spacing:.02em;color:var(--cream)}

.lines{max-width:780px;font-size:clamp(1.2rem,2.3vw,1.9rem);font-weight:300;font-style:italic;line-height:1.45;color:var(--cream)}
.lines .ln{display:block}
.w{display:inline-block;white-space:pre}

.eyebrow{font-size:.78rem;letter-spacing:.5em;text-transform:uppercase;color:var(--gold);padding-left:.5em}
.script{font-family:var(--script);font-weight:400;color:var(--gold-hi);
  text-shadow:0 0 40px rgba(246,227,168,.25)}

/* prologue */
#s-prologue{justify-content:center;gap:3.2vh}
#s-prologue .script{font-size:clamp(3.6rem,12vw,8.5rem);line-height:1}
#s-prologue .lines{font-size:clamp(1.15rem,2.2vw,1.7rem);color:var(--cream-dim)}
.tiny{font-size:.85rem;letter-spacing:.18em;color:rgba(244,234,214,.4);font-style:italic}

.btn-gold{position:relative;padding:15px 38px;border-radius:999px;letter-spacing:.34em;text-transform:uppercase;font-size:.8rem;font-weight:500;
  color:#1a1206;background:linear-gradient(135deg,#f7e6b0,#d4a955 45%,#b5873a 70%,#f0d690);
  box-shadow:0 0 0 1px rgba(255,240,200,.35) inset,0 10px 40px -8px rgba(217,180,106,.55);transition:transform .4s,box-shadow .4s}
.btn-gold:hover{transform:translateY(-2px);box-shadow:0 0 0 1px rgba(255,240,200,.5) inset,0 16px 50px -8px rgba(217,180,106,.8)}
.btn-ghost{padding:10px 30px;border-radius:999px;border:1px solid rgba(217,180,106,.55);letter-spacing:.4em;text-transform:uppercase;
  font-size:.74rem;color:var(--gold-hi);background:rgba(10,8,20,.35);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);transition:background .4s,border-color .4s}
.btn-ghost:hover{background:rgba(217,180,106,.14);border-color:var(--gold-hi)}

/* orbs */
.orb{position:absolute;width:14px;height:14px;border-radius:50%;transform:translate(-50%,-50%);
  background:radial-gradient(circle,#fff 0 30%,#ffe9b8 45%,rgba(255,210,140,0) 72%);
  box-shadow:0 0 18px 6px rgba(255,225,160,.55),0 0 60px 18px rgba(255,200,120,.18)}
.orb.big{width:20px;height:20px}
.orb.friend{width:9px;height:9px;background:radial-gradient(circle,#fff 0 35%,#cfe0ff 50%,rgba(160,190,255,0) 72%);box-shadow:0 0 14px 5px rgba(170,200,255,.6)}
.orb-label{position:absolute;transform:translate(-50%,0);font-style:italic;font-size:1.1rem;color:var(--cream-dim);letter-spacing:.08em}
.thread{position:absolute;inset:0;width:100%;height:100%;overflow:visible;filter:drop-shadow(0 0 6px rgba(255,51,80,.9))}
.thread path{fill:none;stroke:var(--thread);stroke-width:1.8;stroke-linecap:round}
.tiny-heart{position:absolute;left:50%;top:0;transform:translate(-50%,-50%);color:var(--thread);font-size:22px;filter:drop-shadow(0 0 10px rgba(255,51,80,.9))}

/* constellation */
.constellation svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.constellation line{stroke:rgba(246,227,168,.55);stroke-width:1}
.memory{position:absolute;transform:translate(-50%,-50%);width:clamp(88px,12.5vw,165px)}
.memory .dot{position:absolute;left:50%;top:50%}
.polaroid{position:relative;background:#f8f1e3;padding:7% 7% 0;border-radius:3px;
  box-shadow:0 18px 40px -12px rgba(0,0,0,.8),0 0 0 1px rgba(0,0,0,.08);transition:transform .5s cubic-bezier(.2,.8,.2,1)}
.polaroid:hover{transform:translateY(-6px) rotate(0deg)!important;z-index:3}
.polaroid img{display:block;width:100%;aspect-ratio:4/5;object-fit:cover;background:#ccc;filter:sepia(.18) contrast(1.02)}
.polaroid .cap{font-family:var(--script);color:#3b2a1b;font-size:clamp(.8rem,1.3vw,1.12rem);padding:.35em 0 .5em;line-height:1.1}

/* counter */
.count-wrap{display:flex;flex-direction:column;align-items:center;gap:.2rem}
.days{font-size:clamp(3.4rem,min(13vw,13vh),9.5rem);font-weight:300;line-height:.95;color:var(--gold-hi);
  background:linear-gradient(180deg,#fff4d0,#d9b46a 60%,#9c7430);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  filter:drop-shadow(0 0 30px rgba(217,180,106,.25));font-variant-numeric:lining-nums}
.days-lbl{font-size:.8rem;letter-spacing:.5em;text-transform:uppercase;color:var(--gold);padding-left:.5em}
.ticker{font-size:clamp(.85rem,1.4vw,1.05rem);color:var(--cream-dim);font-style:italic;letter-spacing:.04em;font-variant-numeric:tabular-nums;margin-top:.6rem}
.grid{display:grid;grid-template-columns:repeat(40,1fr);gap:3px;width:min(720px,88vw,52vh)}
.grid i{display:block;aspect-ratio:1;border-radius:50%;background:rgba(244,234,214,.09)}
.grid i.on{background:var(--gold);box-shadow:0 0 5px rgba(217,180,106,.7)}
.grid i.today{background:var(--thread);box-shadow:0 0 10px 3px rgba(255,51,80,.8);animation:beat 1.2s infinite}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.8)}30%{transform:scale(1.1)}45%{transform:scale(1.5)}}
.grid-note{font-size:.95rem;font-style:italic;color:var(--cream-dim);letter-spacing:.05em}
@media (orientation:portrait){.grid{grid-template-columns:repeat(25,1fr);width:min(86vw,24vh);gap:2px}}

/* locket scene */
#s-locket{padding:0;display:block}
.deco{position:absolute;inset:0;pointer-events:none}
.moon{position:absolute;right:max(4vw,12px);top:4vh;width:clamp(120px,19vw,250px);filter:drop-shadow(0 0 40px rgba(246,227,168,.28))}
.cloud{position:absolute;pointer-events:none}
.cloud.c1{left:50%;top:1vh;width:clamp(260px,34vw,480px);transform:translateX(-78%)}
.cloud.c2{left:50%;top:9vh;width:clamp(180px,22vw,320px);transform:translateX(2%);opacity:.9}
.cloud.c3{left:4vw;top:22vh;width:clamp(120px,14vw,200px);opacity:.55}
.waves{position:absolute;left:0;right:0;bottom:0;height:30vh;pointer-events:none}
.wave{position:absolute;left:0;right:0;bottom:0;background-repeat:repeat-x;background-position:0 100%}
.wave.w1{height:26vh;opacity:.75;animation:wave 38s linear infinite}
.wave.w2{height:19vh;animation:wave 26s linear infinite reverse}
.wave.w3{height:12vh;animation:wave 17s linear infinite}
@keyframes wave{to{background-position-x:var(--tile)}}

.pend{position:absolute;left:50%;top:-4px;width:var(--W);margin-left:calc(var(--W) / -2);transform-origin:50% 0;z-index:3}
.chain{width:10px;height:var(--L);margin:0 auto;
  background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='14'><ellipse cx='5' cy='4.2' rx='2.4' ry='3.9' fill='none' stroke='%23e8c983' stroke-width='1.25'/><rect x='4.35' y='8.2' width='1.3' height='5.8' rx='.65' fill='%23b38a45'/></svg>") repeat-y center top/10px 14px;
  filter:drop-shadow(0 0 2px rgba(0,0,0,.6))}
.bail{width:16px;height:16px;margin:-2px auto -7px;border-radius:50%;border:3px solid #d8b265;box-shadow:inset 0 0 0 1px #7a5520,0 0 0 1px #6b4a18;position:relative;z-index:2}
.locket{position:relative;width:var(--W);height:var(--W);perspective:1100px;transform-style:preserve-3d;cursor:grab;touch-action:none}
.locket:active{cursor:grabbing}
.locket svg{width:100%;height:100%;display:block;overflow:visible}
.half,.cover,.face{position:absolute;inset:0}
.cover{transform-style:preserve-3d;transform-origin:3% 38%}
.face{backface-visibility:hidden;-webkit-backface-visibility:hidden}
.face.back{transform:rotateY(180deg)}
.half svg,.face svg{filter:drop-shadow(0 14px 18px rgba(0,0,0,.55))}
.hinge{position:absolute;left:1%;top:31%;width:5%;height:15%;border-radius:4px;background:linear-gradient(90deg,#6d4a12,#f3d98f,#8a6424);z-index:-1}
.locket-glow{position:absolute;left:50%;top:50%;width:260%;height:260%;transform:translate(-50%,-50%);border-radius:50%;pointer-events:none;opacity:0;
  background:radial-gradient(circle,rgba(255,220,150,.35),rgba(255,120,120,.08) 40%,transparent 65%)}

.under{position:absolute;left:0;right:0;top:calc(var(--L) + var(--W) + 30px);display:flex;flex-direction:column;align-items:center;gap:12px;z-index:4;padding:0 16px}
.locket-cap{font-family:var(--script);font-size:clamp(1.6rem,3.4vw,2.6rem);color:var(--gold-hi);opacity:0;text-shadow:0 0 24px rgba(246,227,168,.35)}
.drag-hint{font-size:.8rem;font-style:italic;letter-spacing:.14em;color:rgba(244,234,214,.45)}

.envelope{position:absolute;left:50%;bottom:6.5vh;width:min(210px,46vw);aspect-ratio:1.55;margin-left:calc(min(210px,46vw) / -2);perspective:800px;z-index:5;cursor:pointer;visibility:hidden}
.env-back,.env-front,.env-flap,.env-letter{position:absolute;inset:0}
.env-back{background:linear-gradient(180deg,#cbb48c,#b39a70);border-radius:5px;box-shadow:0 22px 40px -12px rgba(0,0,0,.8)}
.env-letter{z-index:1;left:7%;right:7%;top:8%;bottom:6%;background:#fbf6ea;border-radius:2px;
  background-image:repeating-linear-gradient(180deg,transparent 0 9px,rgba(120,90,60,.2) 9px 10px);padding:10% 9%;
  font-family:var(--script);color:#5a3d25;font-size:11px;line-height:10px;text-align:left;overflow:hidden}
.env-front{background:linear-gradient(170deg,#e7d6b3,#d6c197);clip-path:polygon(0 0,50% 58%,100% 0,100% 100%,0 100%);border-radius:5px;z-index:2}
.env-front::after{content:"";position:absolute;inset:0;background:linear-gradient(20deg,rgba(0,0,0,.08),transparent 40%)}
.env-flap{bottom:auto;height:62%;background:linear-gradient(180deg,#dcc7a0,#c9b187);clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:50% 0;z-index:3;backface-visibility:visible}
.seal{position:absolute;left:50%;top:54%;width:25%;aspect-ratio:1;transform:translate(-50%,-50%);z-index:4;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#e3485a,#a3121f 55%,#6a0710);
  box-shadow:0 3px 8px rgba(0,0,0,.45),inset 0 -3px 6px rgba(0,0,0,.35),inset 0 2px 3px rgba(255,255,255,.25);display:grid;place-items:center}
.seal svg{width:52%;height:52%}
.env-tip{position:absolute;left:0;right:0;top:-34px;text-align:center;font-size:.78rem;letter-spacing:.3em;text-transform:uppercase;color:var(--gold-hi);opacity:0;white-space:nowrap}

/* letter modal */
.modal{position:fixed;inset:0;z-index:30;display:grid;place-items:center;padding:16px;background:rgba(4,3,10,.72);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);visibility:hidden;opacity:0}
.paper{position:relative;width:min(600px,100%);height:min(86vh,820px);overflow:auto;border-radius:4px;
  background-color:#fbf6ea;color:#3a2a1d;padding:56px clamp(22px,6vw,58px) 30px;
  background-image:
    linear-gradient(90deg,transparent calc(clamp(22px,6vw,58px) - 16px),rgba(216,40,63,.28) calc(clamp(22px,6vw,58px) - 16px),rgba(216,40,63,.28) calc(clamp(22px,6vw,58px) - 15px),transparent calc(clamp(22px,6vw,58px) - 15px)),
    repeating-linear-gradient(180deg,transparent 0 33px,rgba(110,80,50,.16) 33px 34px);
  background-attachment:local;
  box-shadow:0 40px 90px -20px rgba(0,0,0,.9),inset 0 0 80px rgba(160,120,70,.18);
  user-select:text;-webkit-user-select:text;touch-action:pan-y;scrollbar-width:thin;scrollbar-color:#c9b187 transparent}
.paper h3{font-family:var(--script);font-weight:400;font-size:clamp(2.2rem,6vw,3rem);text-align:center;color:#6b1420;line-height:1.1}
.paper .date{text-align:center;font-size:.7rem;letter-spacing:.34em;text-transform:uppercase;color:#9b7f60;margin:.4rem 0 1.6rem}
.paper .body p{font-size:clamp(1.08rem,2.6vw,1.24rem);line-height:34px;margin-bottom:34px;text-align:left;min-height:34px}
.paper .body p.sig{font-family:var(--script);font-size:1.5rem;margin-bottom:0;color:#6b1420}
.caret{display:inline-block;width:1px;height:1.05em;background:#6b1420;vertical-align:-3px;margin-left:1px;animation:blink .9s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.paper .x{position:absolute;right:14px;top:12px;width:36px;height:36px;border-radius:50%;font-size:22px;color:#8a6a4a;line-height:1}
.paper .x:hover{background:rgba(0,0,0,.05)}
.paper .actions{position:sticky;bottom:-30px;display:flex;justify-content:center;padding:14px 0 18px;background:linear-gradient(180deg,rgba(251,246,234,0),#fbf6ea 45%)}
.paper .skip{padding:8px 22px;border-radius:999px;border:1px solid rgba(107,20,32,.35);font-size:.68rem;letter-spacing:.3em;text-transform:uppercase;color:#6b1420;font-weight:600}
.paper .skip:hover{background:rgba(107,20,32,.06)}

/* finale */
#s-final{justify-content:center;gap:2.6vh}
#s-final .script.huge{font-size:clamp(4rem,13vw,9rem);line-height:1}
.q{font-size:clamp(1.25rem,2.6vw,2rem);font-style:italic;font-weight:300;max-width:760px}
.choices{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.answer{font-family:var(--script);font-size:clamp(1.8rem,4vw,3rem);color:var(--gold-hi);min-height:1.3em}
.replay{margin-top:1vh;font-size:.78rem;letter-spacing:.3em;text-transform:uppercase;color:rgba(244,234,214,.45);opacity:0}
.replay:hover{color:var(--gold-hi)}
.signed{font-size:.9rem;letter-spacing:.2em;color:rgba(244,234,214,.45);font-style:italic}

/* HUD */
.hint{position:fixed;left:50%;bottom:max(3.2vh,18px);transform:translateX(-50%);z-index:12;display:flex;flex-direction:column;align-items:center;gap:8px;
  font-size:.72rem;letter-spacing:.34em;text-transform:uppercase;color:rgba(244,234,214,.55);opacity:0;pointer-events:none;padding-left:.34em;white-space:nowrap}
.hint i{display:block;width:1px;height:26px;background:linear-gradient(180deg,var(--gold),transparent);animation:drip 1.8s ease-in-out infinite;transform-origin:top}
@keyframes drip{0%{transform:scaleY(0);opacity:1}60%{transform:scaleY(1);opacity:1}100%{transform:scaleY(1);opacity:0}}
.progress{position:fixed;left:max(2.2vw,14px);top:50%;transform:translateY(-50%);z-index:12;display:flex;flex-direction:column;gap:12px}
.progress b{display:block;width:5px;height:5px;border-radius:50%;background:rgba(244,234,214,.22);transition:all .6s}
.progress b.on{background:var(--gold);box-shadow:0 0 8px var(--gold);transform:scale(1.4)}
.sound{position:fixed;right:max(2vw,12px);bottom:max(2.6vh,14px);z-index:12;width:42px;height:42px;border-radius:50%;border:1px solid rgba(217,180,106,.35);display:none;place-items:center;background:rgba(10,8,20,.35)}
.sound span{display:flex;gap:2px;align-items:flex-end;height:14px}
.sound span i{display:block;width:2px;background:var(--gold-hi);height:100%;animation:eq 1s ease-in-out infinite}
.sound span i:nth-child(2){animation-delay:-.3s}.sound span i:nth-child(3){animation-delay:-.6s}.sound span i:nth-child(4){animation-delay:-.15s}
.sound.muted span i{animation:none;height:2px}
@keyframes eq{0%,100%{height:25%}50%{height:100%}}

/* cursor */
.cur,.cur-ring{position:fixed;left:0;top:0;z-index:50;pointer-events:none;border-radius:50%;display:none}
.cur{width:6px;height:6px;margin:-3px 0 0 -3px;background:var(--gold-hi);box-shadow:0 0 10px var(--gold)}
.cur-ring{width:34px;height:34px;margin:-17px 0 0 -17px;border:1px solid rgba(246,227,168,.45);transition:width .35s,height .35s,margin .35s,border-color .35s}
.cur-ring.big{width:58px;height:58px;margin:-29px 0 0 -29px;border-color:var(--gold-hi)}
@media (pointer:fine){.cur,.cur-ring{display:block} body,button,.locket,.envelope{cursor:none!important}}
@media (max-width:600px){.progress{display:none}.chapter .num::before,.chapter .num::after{width:24px}}
@media (prefers-reduced-motion:reduce){.grain{animation:none}.wave{animation:none!important}}
</style>
</head>
<body>

<script>const CONFIG = /*__CONFIG__*/null;</script>

<canvas id="sky"></canvas>

<main id="stage">
  <!-- 0 · PROLOGUE -->
  <section class="scene" id="s-prologue">
    <p class="eyebrow p-in">таван бүлэгтэй түүх</p>
    <h1 class="script p-in" id="dearTitle">Хайрт минь,</h1>
    <p class="lines" data-fill="prologue"></p>
    <button class="btn-gold p-in" id="begin">Түүхээ нээх</button>
    <p class="tiny p-in">дуутай үзвэл илүү гоё ♪</p>
  </section>

  <!-- 1 · BEFORE YOU -->
  <section class="scene" id="s-before">
    <div class="chapter"><span class="num">I бүлэг</span><h2 data-ch="0"></h2></div>
    <div class="visual"><div class="orb big" id="loneStar" style="left:50%;top:50%"></div></div>
    <p class="lines" data-fill="ch1"></p>
  </section>

  <!-- 2 · MEETING -->
  <section class="scene" id="s-meet">
    <div class="chapter"><span class="num">II бүлэг</span><h2 data-ch="1"></h2></div>
    <div class="visual" id="meet">
      <svg class="thread" id="threadSvg"><path id="threadPath" pathLength="1"/></svg>
      <div class="orb big" id="orbA" style="left:18%;top:50%"></div>
      <div class="orb big" id="orbB" style="left:82%;top:50%"></div>
      <div class="orb friend" id="orbF" style="left:50%;top:96%"></div>
      <span class="orb-label" id="lblA" style="left:18%;top:calc(50% + 22px)">би</span>
      <span class="orb-label" id="lblB" style="left:82%;top:calc(50% + 22px)">чи</span>
      <span class="tiny-heart" id="tinyHeart" style="top:61%">♥</span>
    </div>
    <p class="lines" data-fill="ch2"></p>
  </section>

  <!-- 3 · LITTLE MOMENTS -->
  <section class="scene" id="s-moments">
    <div class="chapter"><span class="num">III бүлэг</span><h2 data-ch="2"></h2></div>
    <div class="visual constellation" id="constellation"><svg id="constLines"></svg></div>
    <p class="lines" data-fill="ch3"></p>
  </section>

  <!-- 4 · COUNTING DAYS -->
  <section class="scene" id="s-count">
    <div class="chapter"><span class="num">IV бүлэг</span><h2 data-ch="3"></h2></div>
    <div class="visual" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2.4vh">
      <div class="count-wrap">
        <div class="days" id="daysNum">0</div>
        <div class="days-lbl">хамтдаа өнгөрүүлсэн өдөр</div>
        <div class="ticker" id="ticker">&nbsp;</div>
      </div>
      <div class="grid" id="grid"></div>
      <div class="grid-note" id="gridNote">&nbsp;</div>
    </div>
    <p class="lines" data-fill="ch4"></p>
  </section>

  <!-- 5 · THE KEEPSAKE -->
  <section class="scene" id="s-locket">
    <div class="deco" id="deco">
      <svg class="moon" viewBox="0 0 200 200" aria-hidden="true">
        <defs>
          <radialGradient id="mHalo"><stop offset="0" stop-color="#f6e3a8" stop-opacity=".22"/><stop offset="1" stop-color="#f6e3a8" stop-opacity="0"/></radialGradient>
          <linearGradient id="mGold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff2c6"/><stop offset=".5" stop-color="#e0bb6a"/><stop offset="1" stop-color="#8f6726"/></linearGradient>
          <mask id="mCut"><rect width="200" height="200" fill="#fff"/><circle cx="128" cy="80" r="62" fill="#000"/></mask>

<script>
(() => {
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
if (reduce) gsap.globalTimeline.timeScale(1.8);

/* ---------- data ---------- */
const DAY = 864e5;
const start = new Date(CONFIG.startDate + 'T00:00:00');
const dayCount = () => Math.max(1, Math.floor((Date.now() - start) / DAY) + 1);
const DAYS = dayCount();
const fill = s => s.replace(/\{days\}/g, DAYS.toLocaleString('en-US')).replace(/\{to\}/g, CONFIG.to).replace(/\{from\}/g, CONFIG.from);

/* ---------- text setup ---------- */
function buildLines(el, text) {
  el.innerHTML = '';
  fill(text).split('\n').forEach(line => {
    const ln = document.createElement('span'); ln.className = 'ln';
    line.split(/(\s+)/).forEach(tok => {
      if (!tok) return;
      const w = document.createElement('span'); w.className = 'w'; w.textContent = tok; ln.appendChild(w);
    });
    el.appendChild(ln);
  });
}
$$('[data-fill]').forEach(el => buildLines(el, CONFIG.text[el.dataset.fill] || ''));
$$('[data-ch]').forEach(el => el.textContent = fill(CONFIG.chapters[+el.dataset.ch] || ''));
$('#dearTitle').textContent = CONFIG.to + ',';
$('#signed').textContent = '— ' + CONFIG.from + ', ' + DAYS.toLocaleString('en-US') + ' дахь өдөр';

const revealLines = (el, stagger = .05) => gsap.fromTo($$('.w', el),
  { opacity: 0, y: 16, filter: 'blur(8px)' },
  { opacity: 1, y: 0, filter: 'blur(0px)', duration: 1.1, ease: 'power3.out', stagger });
const revealChapter = sc => {
  const c = $('.chapter', sc); if (!c) return gsap.timeline();
  return gsap.timeline()
    .fromTo($('.num', c), { opacity: 0, letterSpacing: '.9em' }, { opacity: 1, letterSpacing: '.42em', duration: 1.4, ease: 'power3.out' })
    .fromTo($('h2', c), { opacity: 0, y: 14, filter: 'blur(10px)' }, { opacity: 1, y: 0, filter: 'blur(0px)', duration: 1.3, ease: 'power3.out' }, '-=1');
};

/* ---------- images ---------- */
function placeholder(label, hue) {
  const svg = `<svg xmlns='http://www.w3.org/2000/svg' width='400' height='500' viewBox='0 0 400 500'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='hsl(${hue},48%,74%)'/><stop offset='1' stop-color='hsl(${hue + 25},38%,34%)'/></linearGradient><radialGradient id='r' cx='.3' cy='.25' r='.8'><stop offset='0' stop-color='#fff' stop-opacity='.35'/><stop offset='1' stop-color='#fff' stop-opacity='0'/></radialGradient></defs><rect width='400' height='500' fill='url(#g)'/><rect width='400' height='500' fill='url(#r)'/><path d='M200 318 C152 282 116 254 116 212 C116 184 136 166 160 166 C177 166 190 175 200 189 C210 175 223 166 240 166 C264 166 284 184 284 212 C284 254 248 282 200 318Z' fill='rgba(255,255,255,.32)'/><text x='200' y='392' text-anchor='middle' font-family='Georgia,serif' font-style='italic' font-size='30' fill='rgba(255,255,255,.9)'>${label}</text></svg>`;
  return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
}
function loadImg(src, fb, cb) { if (!src) return cb(fb); const im = new Image(); im.onload = () => cb(src); im.onerror = () => cb(fb); im.src = src; }
loadImg(CONFIG.locketPhotos[0], placeholder('you', 345), u => $('#lp1').setAttribute('href', u));
loadImg(CONFIG.locketPhotos[1], placeholder('me', 20), u => $('#lp2').setAttribute('href', u));

/* ---------- sky canvas ---------- */
const sky = $('#sky'), sctx = sky.getContext('2d');
const fx = $('#fx'), fctx = fx.getContext('2d');
let W = 0, H = 0, DPR = 1, stars = [], shooting = [];
const skyState = { bright: .85, drift: 0 };
const mouse = { x: 0, y: 0, tx: 0, ty: 0 };
function resize() {
  DPR = Math.min(devicePixelRatio || 1, 2); W = innerWidth; H = innerHeight;
  [sky, fx].forEach(c => { c.width = W * DPR; c.height = H * DPR; });
  sctx.setTransform(DPR, 0, 0, DPR, 0, 0); fctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  const n = Math.round(Math.min(420, W * H / 3800));
  stars = Array.from({ length: n }, () => ({
    x: Math.random() * W, y: Math.random() * H, z: Math.random() * .9 + .1,
    r: Math.random() < .06 ? Math.random() * 1.3 + 1.1 : Math.random() * .9 + .25,
    p: Math.random() * 6.28, s: Math.random() * 1.6 + .4,
    c: Math.random() < .15 ? '255,214,170' : Math.random() < .2 ? '190,210,255' : '255,250,240'
  }));
  const L = Math.min(H * .34, 320), Wl = Math.min(W * .36, H * .21, 200);
  document.documentElement.style.setProperty('--L', L + 'px');
  document.documentElement.style.setProperty('--W', Wl + 'px');
  if (typeof layoutMemories === 'function') layoutMemories();
}
addEventListener('resize', resize);
addEventListener('pointermove', e => { mouse.tx = e.clientX / W - .5; mouse.ty = e.clientY / H - .5; });

function drawSky(t) {
  sctx.clearRect(0, 0, W, H);
  mouse.x += (mouse.tx - mouse.x) * .04; mouse.y += (mouse.ty - mouse.y) * .04;
  const b = skyState.bright;
  for (const s of stars) {
    const a = (.45 + .55 * Math.sin(t * .001 * s.s + s.p)) * b * (.35 + s.z * .65);
    if (a <= .01) continue;
    let x = s.x - mouse.x * 40 * s.z, y = s.y - mouse.y * 30 * s.z - skyState.drift * s.z;
    y = ((y % H) + H) % H;
    sctx.fillStyle = `rgba(${s.c},${Math.min(1, a)})`;
    sctx.beginPath(); sctx.arc(x, y, s.r, 0, 6.283); sctx.fill();
    if (s.r > 1.1 && a > .5) { sctx.fillStyle = `rgba(${s.c},${a * .12})`; sctx.beginPath(); sctx.arc(x, y, s.r * 5, 0, 6.283); sctx.fill(); }
  }
  if (b > .6 && Math.random() < .0035 * b) shooting.push({ x: Math.random() * W * .8 + W * .1, y: Math.random() * H * .4, vx: -(6 + Math.random() * 5), vy: 3 + Math.random() * 2, life: 1 });
  shooting = shooting.filter(s => s.life > 0);
  for (const s of shooting) {
    const g = sctx.createLinearGradient(s.x, s.y, s.x - s.vx * 14, s.y - s.vy * 14);
    g.addColorStop(0, `rgba(255,245,220,${s.life})`); g.addColorStop(1, 'rgba(255,245,220,0)');
    sctx.strokeStyle = g; sctx.lineWidth = 1.4; sctx.beginPath(); sctx.moveTo(s.x, s.y); sctx.lineTo(s.x - s.vx * 14, s.y - s.vy * 14); sctx.stroke();
    s.x += s.vx; s.y += s.vy; s.life -= .018;
  }
}

/* ---------- fx particles ---------- */
let parts = [];
function heartPath(c, x, y, s) {
  c.beginPath(); c.moveTo(x, y + s * .3);
  c.bezierCurveTo(x, y, x - s * .5, y, x - s * .5, y + s * .3);
  c.bezierCurveTo(x - s * .5, y + s * .6, x, y + s * .78, x, y + s);
  c.bezierCurveTo(x, y + s * .78, x + s * .5, y + s * .6, x + s * .5, y + s * .3);
  c.bezierCurveTo(x + s * .5, y, x, y, x, y + s * .3); c.fill();
}
function burst(x, y, n = 60, opts = {}) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * 6.283, v = (opts.speed || 5) * (.3 + Math.random());
    parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - (opts.lift || 1.5), g: opts.g ?? .06, life: 1, decay: .008 + Math.random() * .012,
      r: Math.random() * 2.2 + .6, heart: opts.hearts && Math.random() < .55, s: 8 + Math.random() * 14,
      col: opts.hearts && Math.random() < .6 ? '255,70,95' : '255,222,160' });
  }
}
let fireflies = false;
function drawFx() {
  fctx.clearRect(0, 0, W, H);
  if (fireflies && Math.random() < .35) parts.push({ x: Math.random() * W, y: H + 20, vx: (Math.random() - .5) * .6, vy: -(1 + Math.random() * 1.8), g: 0, life: 1, decay: .0035,
    r: 1.5, heart: Math.random() < .5, s: 8 + Math.random() * 16, col: Math.random() < .5 ? '255,70,95' : '255,222,160', wob: Math.random() * 6 });
  parts = parts.filter(p => p.life > 0);
  for (const p of parts) {
    p.vy += p.g; p.x += p.vx + (p.wob ? Math.sin(performance.now() * .002 + p.wob) * .4 : 0); p.y += p.vy; p.vx *= .99; p.life -= p.decay;
    const a = Math.max(0, p.life);
    fctx.fillStyle = `rgba(${p.col},${a})`;
    if (p.heart) { fctx.shadowColor = `rgba(${p.col},${a})`; fctx.shadowBlur = 12; heartPath(fctx, p.x, p.y, p.s); fctx.shadowBlur = 0; }
    else { fctx.beginPath(); fctx.arc(p.x, p.y, p.r, 0, 6.283); fctx.fill(); fctx.fillStyle = `rgba(${p.col},${a * .18})`; fctx.beginPath(); fctx.arc(p.x, p.y, p.r * 4, 0, 6.283); fctx.fill(); }
  }
}
gsap.ticker.add((t) => { const ms = t * 1000; drawSky(ms); drawFx(); });

/* ---------- waves (seamless tiles) ---------- */
function waveTile(fillC, foam, tile) {
  const svg = `<svg xmlns='http://www.w3.org/2000/svg' width='200' height='130' viewBox='0 0 200 130'>
  <path d='M0 72 C40 72 55 34 96 34 C126 34 138 58 122 67 C110 73 99 63 107 55 C122 44 152 72 200 72 L200 130 L0 130Z' fill='${fillC}'/>
  <path d='M96 34 C126 34 138 58 122 67 C110 73 99 63 107 55' fill='none' stroke='${foam}' stroke-width='2.2' stroke-linecap='round'/>
  <path d='M4 82 C40 80 58 50 92 44' fill='none' stroke='${foam}' stroke-opacity='.55' stroke-width='1.2'/>
  <path d='M0 94 C42 92 70 70 110 76 C140 80 160 92 200 94' fill='none' stroke='${foam}' stroke-opacity='.35' stroke-width='1.1'/>
  <path d='M0 108 C50 106 80 94 120 98 C150 101 170 108 200 108' fill='none' stroke='${foam}' stroke-opacity='.22' stroke-width='1'/>
  <circle cx='150' cy='86' r='1.3' fill='${foam}' fill-opacity='.6'/><circle cx='40' cy='100' r='1' fill='${foam}' fill-opacity='.5'/></svg>`;
  return `url("data:image/svg+xml;charset=utf-8,${encodeURIComponent(svg)}")`;
}
[['.w1', '#131d45', '#6f86c9', 300], ['.w2', '#1a2860', '#8fa5e6', 230], ['.w3', '#22347a', '#b5c6ff', 170]].forEach(([s, c, f, t]) => {
  const el = $('.wave' + s); el.style.backgroundImage = waveTile(c, f, t); el.style.backgroundSize = `${t}px 100%`; el.style.setProperty('--tile', t + 'px');
});

/* ---------- memories constellation ---------- */
const cons = $('#constellation'), lineSvg = $('#constLines');
const memEls = CONFIG.memories.map((m, i) => {
  const d = document.createElement('div'); d.className = 'memory';
  d.innerHTML = `<div class="polaroid" style="transform:rotate(${[-5, 4, -2, 5, -3][i % 5]}deg)"><img alt=""><div class="cap"></div></div><div class="orb dot"></div>`;
  $('.cap', d).textContent = m.caption;
  loadImg(m.src, placeholder(m.caption, [340, 15, 30, 280, 350][i % 5]), u => $('img', d).src = u);
  cons.appendChild(d); return d;
});
const memLines = memEls.slice(1).map(() => { const l = document.createElementNS('http://www.w3.org/2000/svg', 'line'); lineSvg.appendChild(l); return l; });
function layoutMemories() {
  const portrait = innerHeight > innerWidth * 1.05;
  const P = portrait
    ? [[27, 16], [73, 30], [29, 50], [72, 68], [34, 86]]
    : [[12, 58], [31, 28], [50, 62], [69, 30], [88, 58]];
  const w = cons.clientWidth || 1, h = cons.clientHeight || 1;
  lineSvg.setAttribute('viewBox', `0 0 ${w} ${h}`);
  memEls.forEach((el, i) => { const p = P[i % P.length]; el.style.left = p[0] + '%'; el.style.top = p[1] + '%'; el._p = p; });
  memLines.forEach((l, i) => { const a = memEls[i]._p, b = memEls[i + 1]._p; l.setAttribute('x1', a[0] * w / 100); l.setAttribute('y1', a[1] * h / 100); l.setAttribute('x2', b[0] * w / 100); l.setAttribute('y2', b[1] * h / 100); l.setAttribute('pathLength', 1); });
  const m = $('#meet'), mw = m.clientWidth || 1, mh = m.clientHeight || 1;
  $('#threadSvg').setAttribute('viewBox', `0 0 ${mw} ${mh}`);
  $('#threadPath').setAttribute('d', `M${.38 * mw} ${.5 * mh} C${.43 * mw} ${.64 * mh} ${.57 * mw} ${.64 * mh} ${.62 * mw} ${.5 * mh}`);
}

/* ---------- days grid ---------- */
const grid = $('#grid'), M = CONFIG.milestone;
const dots = Array.from({ length: M }, () => { const i = document.createElement('i'); grid.appendChild(i); return i; });

/* ---------- pendulum / locket ---------- */
const pend = $('#pend'), locket = $('#locket'), cover = $('#cover');
const P = { th: 0, om: 0, damp: .28, k: 8.5, active: false, drag: false, opened: false, lastA: 0, lastT: 0, moved: 0 };
gsap.ticker.add((time, dt) => {
  if (!P.active) return;
  const h = Math.min(dt, 40) / 1000;
  if (!P.drag) {
    const a = -P.k * Math.sin(P.th) - P.damp * P.om;
    P.om += a * h; P.th += P.om * h;
    if (!P.opened && Math.abs(P.th) < .01 && Math.abs(P.om) < .05) P.om += .35; // never fully still
  }
  gsap.set(pend, { rotation: P.th * 57.2958 });
});
locket.addEventListener('pointerdown', e => {
  P.drag = true; P.moved = 0; locket.setPointerCapture(e.pointerId);
  P.lastT = performance.now(); P.lastA = P.th; e.stopPropagation();
});
locket.addEventListener('pointermove', e => {
  if (!P.drag) return;
  const ax = innerWidth / 2, ay = -4;
  let a = Math.atan2(ax - e.clientX, e.clientY - ay);
  a = Math.max(-1.1, Math.min(1.1, a));
  const now = performance.now(), dtt = Math.max(1, now - P.lastT);
  P.om = (a - P.lastA) / dtt * 1000 * .6; P.moved += Math.abs(a - P.lastA);
  P.th = a; P.lastA = a; P.lastT = now;
});
const endDrag = e => {
  if (!P.drag) return; P.drag = false;
  if (P.moved < .02 && !P.opened) openLocket();
};
locket.addEventListener('pointerup', endDrag); locket.addEventListener('pointercancel', endDrag);
$('#s-locket').addEventListener('pointermove', e => { if (P.active && !P.drag && !P.opened) P.om += (e.movementX || 0) * .0009; });

function locketCenter() { const r = $('.half', locket).getBoundingClientRect(); return { x: r.left + r.width / 2, y: r.top + r.height / 2 }; }
function openLocket() {
  if (P.opened) return; P.opened = true; P.damp = 2.4;
  const c = locketCenter();
  gsap.timeline()
    .to(['#openBtn', '#dragHint'], { opacity: 0, y: 8, duration: .5, onComplete: () => gsap.set(['#openBtn', '#dragHint'], { display: 'none' }) })
    .to(cover, { rotationY: -14, duration: .35, ease: 'power2.out' }, 0)
    .to(cover, { rotationY: -180, duration: 1.7, ease: 'power3.inOut' }, .45)
    .to(locket, { x: () => locket.offsetWidth * .47, duration: 1.7, ease: 'power3.inOut' }, .45)
    .add(() => { const c2 = locketCenter(); burst(c2.x - W * 0, c2.y, 90, { speed: 5, lift: 1.2, g: .03 }); }, .95)
    .to('#locketGlow', { opacity: 1, duration: 1.2, ease: 'sine.out' }, .9)
    .to('#locketGlow', { opacity: .45, duration: 2 }, 2.2)
    .to(skyState, { bright: 1.15, duration: 2 }, .9)
    .fromTo('#locketCap', { opacity: 0, y: 10, filter: 'blur(8px)' }, { opacity: 1, y: 0, filter: 'blur(0px)', duration: 1.4, ease: 'power3.out' }, 1.9)
    .add(riseEnvelope, 2.8);
}
function riseEnvelope() {
  const env = $('#envelope');
  gsap.set(env, { visibility: 'visible' });
  gsap.fromTo(env, { y: '140%', rotation: -6, opacity: 0 }, { y: 0, rotation: 0, opacity: 1, duration: 2.2, ease: 'power3.out',
    onComplete: () => {
      gsap.to(env, { y: -8, rotation: 1.5, duration: 2.4, yoyo: true, repeat: -1, ease: 'sine.inOut' });
      gsap.to('#envTip', { opacity: .9, duration: 1 });
    } });
}
$('#openBtn').addEventListener('click', e => { e.stopPropagation(); openLocket(); });

/* ---------- envelope + letter ---------- */
let envOpened = false, typing = null;
$('#envLetter').textContent = fill(CONFIG.letter[0] + ' ' + CONFIG.letter[1]);
$('#envelope').addEventListener('click', e => {
  e.stopPropagation();
  if (!P.opened) return;
  if (envOpened) { showLetter(false); return; }
  envOpened = true;
  gsap.killTweensOf('#envelope');
  gsap.timeline()
    .to('#envTip', { opacity: 0, duration: .3 })
    .to('#seal', { scale: 1.25, duration: .2, ease: 'power2.out' }, 0)
    .to('#seal', { scale: 0, rotation: 90, opacity: 0, duration: .45, ease: 'back.in(2)' })
    .to('#envFlap', { rotationX: 180, duration: .9, ease: 'power2.inOut' }, '-=.1')
    .set('#envFlap', { zIndex: 0 }, '-=.45')
    .to('#envLetter', { y: '-62%', duration: 1, ease: 'power3.out' }, '-=.2')
    .add(() => showLetter(true), '-=.3');
});
function showLetter(type) {
  const body = $('#letterBody');
  $('#letterTitle').textContent = CONFIG.letterTitle;
  const _d = new Date(); $('#letterDate').textContent = DAYS.toLocaleString('en-US') + ' дахь өдөр бичив · ' + _d.getFullYear() + ' оны ' + (_d.getMonth() + 1) + '-р сарын ' + _d.getDate();
  body.innerHTML = '';
  const paras = CONFIG.letter.map(p => ({ sig: p.startsWith('@'), text: fill(p.replace(/^@/, '')) }));
  const els = paras.map(p => { const el = document.createElement('p'); if (p.sig) el.className = 'sig'; return el; });
  gsap.set('#modal', { visibility: 'visible' });
  gsap.to('#modal', { opacity: 1, duration: .6 });
  gsap.fromTo('#paper', { y: 40, scale: .94, opacity: 0, rotation: -1.5 }, { y: 0, scale: 1, opacity: 1, rotation: 0, duration: 1, ease: 'power3.out' });
  $('#paper').scrollTop = 0;
  $('#skipBtn').style.display = type ? '' : 'none';
  const showAll = () => els.forEach((el, i) => { el.textContent = paras[i].text; body.appendChild(el); });
  if (!type) { showAll(); return; }
  // typewriter
  let pi = 0, ci = 0, stop = false; const caret = document.createElement('span'); caret.className = 'caret';
  const paper = $('#paper');
  const step = () => {
    if (stop) return;
    if (pi >= els.length) { caret.remove(); $('#skipBtn').style.display = 'none'; return; }
    const txt = paras[pi].text, el = els[pi];
    if (ci === 0) body.appendChild(el);
    ci++; el.textContent = txt.slice(0, ci); el.appendChild(caret);
    const ch = txt[ci - 1];
    if (paper.scrollHeight > paper.clientHeight && paper.scrollHeight - paper.scrollTop - paper.clientHeight < 140) paper.scrollTop = paper.scrollHeight;
    let d = 24 + Math.random() * 26;
    if (/[,;—]/.test(ch)) d = 170; if (/[.!?:]/.test(ch)) d = 360;
    if (ci >= txt.length) { pi++; ci = 0; d = 650; }
    typing = setTimeout(step, d);
  };
  typing = setTimeout(step, 900);
  $('#skipBtn').onclick = () => { stop = true; clearTimeout(typing); caret.remove(); showAll(); $('#skipBtn').style.display = 'none'; };
}
function closeLetter() {
  clearTimeout(typing);
  gsap.to('#paper', { y: 30, opacity: 0, scale: .96, duration: .5, ease: 'power2.in' });
  gsap.to('#modal', { opacity: 0, duration: .6, delay: .1, onComplete: () => gsap.set('#modal', { visibility: 'hidden' }) });
  if (current === 5) { canAdvance = true; setHint('үргэлжлүүлэх', true); }
}
$('#closeLetter').addEventListener('click', closeLetter);
$('#modal').addEventListener('click', e => { if (e.target.id === 'modal') closeLetter(); });

/* ---------- scenes ---------- */
const scenes = $$('.scene');
let current = -1, busy = false, canAdvance = false;
const progress = $('#progress');
scenes.forEach(() => progress.appendChild(document.createElement('b')));

const ENTER = [
  // 0 prologue
  sc => { skyState.bright = .9;
    return gsap.timeline()
      .fromTo($$('.p-in', sc)[0], { opacity: 0 }, { opacity: 1, duration: 1.6 })
      .fromTo('#dearTitle', { opacity: 0, y: 20, filter: 'blur(14px)' }, { opacity: 1, y: 0, filter: 'blur(0px)', duration: 2.2, ease: 'power3.out' }, .3)
      .add(revealLines($('.lines', sc), .06), 1.4)
      .fromTo($$('.p-in', sc).slice(2), { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 1.2, stagger: .25, ease: 'power3.out' }, 2.8);
  },
  // 1 before you
  sc => gsap.timeline()
      .to(skyState, { bright: .28, duration: 3, ease: 'sine.inOut' }, 0)
      .add(revealChapter(sc), .2)
      .fromTo('#loneStar', { opacity: 0, scale: 0 }, { opacity: 1, scale: 1, duration: 2, ease: 'power2.out' }, .9)
      .to('#loneStar', { opacity: .5, scale: .8, duration: 1.6, yoyo: true, repeat: -1, ease: 'sine.inOut' }, 3)
      .add(revealLines($('.lines', sc)), 1.6),
  // 2 meeting
  sc => {
    const t = gsap.timeline();
    gsap.set('#orbA', { left: '18%' }); gsap.set('#orbB', { left: '82%' }); gsap.set('#lblA', { left: '18%' }); gsap.set('#lblB', { left: '82%' });
    gsap.set('#orbF', { left: '50%', top: '96%', opacity: 0 }); layoutMemories(); gsap.set('#threadPath', { attr: { 'stroke-dasharray': 1, 'stroke-dashoffset': 1 } }); gsap.set('#tinyHeart', { opacity: 0, scale: 0 });
    return t.add(revealChapter(sc))
      .fromTo(['#orbA', '#orbB', '#lblA', '#lblB'], { opacity: 0 }, { opacity: 1, duration: 1.4, stagger: .2 }, .5)
      .add(revealLines($('.lines', sc).children[0]), 1)
      .to('#orbF', { opacity: 1, duration: .6 }, 2)
      .to('#orbF', { left: '26%', top: '44%', duration: 1.6, ease: 'sine.inOut' }, 2.2)
      .to('#orbA', { scale: 1.8, duration: .35, yoyo: true, repeat: 1 }, 3.7)
      .to('#orbF', { left: '74%', top: '44%', duration: 1.8, ease: 'sine.inOut' }, 3.9)
      .to('#orbB', { scale: 1.8, duration: .35, yoyo: true, repeat: 1 }, 5.6)
      .to('#orbF', { left: '50%', top: '6%', opacity: 0, duration: 2, ease: 'power2.in' }, 5.9)
      .to(['#orbA', '#lblA'], { left: '38%', duration: 2.4, ease: 'power3.inOut' }, 6.2)
      .to(['#orbB', '#lblB'], { left: '62%', duration: 2.4, ease: 'power3.inOut' }, 6.2)
      .to('#threadPath', { attr: { 'stroke-dashoffset': 0 }, duration: 1.8, ease: 'power2.inOut' }, 8.1)
      .to('#tinyHeart', { opacity: 1, scale: 1, duration: .9, ease: 'back.out(3)' }, 9.4)
      .to('#tinyHeart', { scale: 1.25, duration: .5, yoyo: true, repeat: -1, ease: 'sine.inOut' }, 10.3)
      .to(skyState, { bright: 1, duration: 3, ease: 'sine.inOut' }, 8.4)
      .add(revealLines({ querySelectorAll: s => [...$('.lines', sc).children].slice(1).flatMap(c => [...c.querySelectorAll(s)]) }), 9);
  },
  // 3 moments
  sc => {
    layoutMemories();
    const t = gsap.timeline().add(revealChapter(sc));
    gsap.set(memLines, { attr: { 'stroke-dasharray': 1, 'stroke-dashoffset': 1 } });
    memEls.forEach((m, i) => {
      const pol = $('.polaroid', m), dot = $('.dot', m), at = .7 + i * 1.05;
      gsap.set(pol, { opacity: 0, scale: .2, filter: 'blur(10px)' }); gsap.set(dot, { opacity: 0, scale: 0 });
      if (i > 0) t.to(memLines[i - 1], { attr: { 'stroke-dashoffset': 0 }, duration: .8, ease: 'power1.inOut' }, at - .7);
      t.to(dot, { opacity: 1, scale: 1.4, duration: .4 }, at)
       .to(pol, { opacity: 1, scale: 1, filter: 'blur(0px)', duration: 1.1, ease: 'back.out(1.4)' }, at + .25)
       .to(dot, { opacity: 0, duration: .5 }, at + .5);
    });
    return t.add(revealLines($('.lines', sc)), .7 + memEls.length * 1.05);
  },
  // 4 counting
  sc => {
    const t = gsap.timeline().add(revealChapter(sc));
    const lit = Math.min(DAYS, M), n = { v: 0 };
    dots.forEach(d => d.className = '');
    t.fromTo('#grid', { opacity: 0 }, { opacity: 1, duration: 1 }, .5)
     .to(n, { v: DAYS, duration: 3.4, ease: 'power2.inOut', onUpdate: () => $('#daysNum').textContent = Math.round(n.v).toLocaleString('en-US') }, .8)
     .add(() => { dots.slice(0, lit).forEach((d, i) => gsap.delayedCall(i / lit * 3.2, () => d.className = 'on')); }, .8)
     .add(() => { dots[lit - 1].className = 'today'; }, 4.1)
     .fromTo('#gridNote', { opacity: 0 }, { opacity: 1, duration: 1.2 }, 4.2)
     .add(revealLines($('.lines', sc)), 4.6);
    const left = M - DAYS;
    $('#gridNote').textContent = left > 0 ? `${M.toLocaleString('en-US')} хоног хүрэхэд ${left} өдөр үлдлээ` : `${M.toLocaleString('en-US')} хоног — тоолсоор л байна`;
    return t;
  },
  // 5 locket
  sc => {
    P.active = true; P.opened = false; P.damp = .28; P.th = .55; P.om = 0; envOpened = false;
    gsap.set(cover, { rotationY: 0 }); gsap.set(locket, { x: 0 }); gsap.set(['#openBtn', '#dragHint'], { display: '', opacity: 0, y: 0 });
    gsap.set('#locketCap', { opacity: 0 }); gsap.set('#locketGlow', { opacity: 0 });
    gsap.killTweensOf('#envelope'); gsap.set('#envelope', { visibility: 'hidden' }); gsap.set('#envTip', { opacity: 0 });
    gsap.set('#seal', { scale: 1, rotation: 0, opacity: 1 }); gsap.set('#envFlap', { rotationX: 0, zIndex: 3 }); gsap.set('#envLetter', { y: 0 });
    $('#locketCap').textContent = CONFIG.text.locketCap;
    return gsap.timeline()
      .to(skyState, { bright: .9, duration: 2 }, 0)
      .fromTo('.moon', { opacity: 0, y: -30 }, { opacity: 1, y: 0, duration: 2.4, ease: 'power3.out' }, 0)
      .fromTo('.cloud', { opacity: 0, x: (i) => [-60, 60, -40][i] }, { opacity: (i) => [1, .9, .55][i], x: 0, duration: 2.6, ease: 'power3.out', stagger: .15 }, .2)
      .fromTo('.waves', { y: '40%', opacity: 0 }, { y: 0, opacity: 1, duration: 2.4, ease: 'power3.out' }, .1)
      .fromTo(pend, { yPercent: -120 }, { yPercent: 0, duration: 2.2, ease: 'power3.out' }, .5)
      .to(['#openBtn', '#dragHint'], { opacity: 1, duration: 1, stagger: .3 }, 2.4);
  },
  // 6 finale
  sc => {
    P.active = false; fireflies = true;
    gsap.set('#answer', { textContent: '' }); gsap.set('#choices', { display: 'flex', opacity: 1 }); gsap.set('#replay', { opacity: 0 });
    return gsap.timeline()
      .to(skyState, { bright: 1.1, duration: 2 }, 0)
      .add(revealLines($('.lines', sc)), .3)
      .fromTo('#ily', { opacity: 0, scale: .9, filter: 'blur(16px)' }, { opacity: 1, scale: 1, filter: 'blur(0px)', duration: 2.4, ease: 'power3.out' }, 2)
      .add(revealLines($('.q', sc), .04), 3.6)
      .fromTo('#choices', { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 1 }, 5)
      .fromTo('#signed', { opacity: 0 }, { opacity: 1, duration: 1.4 }, 5.4);
  }
];
const AUTO_ADVANCE = [false, true, true, true, true, false, false];

function setHint(text, on) {
  if (text) $('#hintText').textContent = text;
  gsap.to('#hint', { opacity: on ? 1 : 0, duration: .8 });
}
function go(i) {
  if (busy || i < 0 || i >= scenes.length || i === current) return;
  busy = true; canAdvance = false; setHint(null, false);
  const prev = scenes[current], next = scenes[i];
  if (current === 5 && i !== 5) P.active = false;
  if (i !== 6) fireflies = false;
  const tl = gsap.timeline();
  if (prev) tl.to(prev, { opacity: 0, filter: 'blur(8px)', scale: .985, duration: .9, ease: 'power2.in', onComplete: () => { prev.classList.remove('active'); gsap.killTweensOf($$('*', prev)); } });
  tl.add(() => {
    current = i;
    $$('b', progress).forEach((b, k) => b.classList.toggle('on', k === i));
    next.classList.add('active');
    gsap.set(next, { opacity: 1, filter: 'blur(0px)', scale: 1 });
    const inner = ENTER[i](next);
    const readyAt = i === 0 ? .6 : Math.min(inner.duration(), i === 2 ? 10 : 6) * 0.8;
    gsap.delayedCall(Math.max(.8, readyAt), () => { busy = false; if (AUTO_ADVANCE[i]) { canAdvance = true; setHint(isTouch ? 'үргэлжлүүлэхийн тулд дарна уу' : 'дарах эсвэл гүйлгэж үргэлжлүүлнэ', true); } });
  });
}
const isTouch = matchMedia('(pointer:coarse)').matches;
function advance() { if (!busy && canAdvance) go(current + 1); }

$('#stage').addEventListener('click', e => { if (e.target.closest('button,.envelope,.locket,.polaroid')) return; advance(); });
let wheelLock = 0;
addEventListener('wheel', e => {
  if ($('#modal').style.visibility === 'visible' || e.target.closest('.paper')) return;
  const now = Date.now(); if (now < wheelLock || Math.abs(e.deltaY) < 25) return;
  wheelLock = now + 1400;
  if (e.deltaY > 0) advance(); else if (!busy && current > 1 && current !== 6) go(current - 1);
}, { passive: true });
addEventListener('keydown', e => {
  if (e.key === 'Escape' && $('#modal').style.visibility === 'visible') return closeLetter();
  if ($('#modal').style.visibility === 'visible') return;
  if ([' ', 'Enter', 'ArrowRight', 'ArrowDown', 'PageDown'].includes(e.key)) { e.preventDefault(); if (current === 0) begin(); else advance(); }
  if (['ArrowLeft', 'ArrowUp', 'PageUp'].includes(e.key) && !busy && current > 1) go(current - 1);
});
let ty0 = null;
addEventListener('touchstart', e => { ty0 = e.touches[0].clientY; }, { passive: true });
addEventListener('touchend', e => { if (ty0 == null || e.target.closest('.paper')) return; const dy = ty0 - e.changedTouches[0].clientY; if (dy > 60) advance(); ty0 = null; }, { passive: true });

/* ---------- music ---------- */
const bgm = $('#bgm'), soundBtn = $('#sound');
let musicOK = false;
if (CONFIG.music) { bgm.src = CONFIG.music; bgm.addEventListener('canplay', () => { musicOK = true; }, { once: true }); bgm.addEventListener('error', () => { musicOK = false; soundBtn.style.display = 'none'; }); }
function startMusic() {
  if (!CONFIG.music) return;
  bgm.volume = 0;
  bgm.play().then(() => { soundBtn.style.display = 'grid'; gsap.to(bgm, { volume: .6, duration: 4 }); }).catch(() => {});
}
soundBtn.addEventListener('click', e => { e.stopPropagation(); bgm.muted = !bgm.muted; soundBtn.classList.toggle('muted', bgm.muted); });

/* ---------- begin / finale ---------- */
function begin() {
  if (current !== 0 || busy) return;
  startMusic();
  const r = $('#begin').getBoundingClientRect(); burst(r.left + r.width / 2, r.top + r.height / 2, 50, { speed: 4 });
  go(1);
}
$('#begin').addEventListener('click', e => { e.stopPropagation(); begin(); });
$$('[data-yes]').forEach(b => b.addEventListener('click', e => {
  e.stopPropagation();
  const r = b.getBoundingClientRect();
  burst(r.left + r.width / 2, r.top + r.height / 2, 140, { speed: 9, lift: 3, g: .07, hearts: true });
  setTimeout(() => burst(W * .2, H * .4, 70, { speed: 7, hearts: true, g: .05 }), 350);
  setTimeout(() => burst(W * .8, H * .4, 70, { speed: 7, hearts: true, g: .05 }), 650);
  gsap.to('#choices', { opacity: 0, y: -10, duration: .5, onComplete: () => gsap.set('#choices', { display: 'none' }) });
  const ans = $('#answer'); buildLines(ans, CONFIG.text.answer);
  gsap.timeline().add(revealLines(ans, .08), .5).to('#replay', { opacity: 1, duration: 1.2 }, 2.5);
  gsap.fromTo('#ily', { scale: 1 }, { scale: 1.08, duration: .6, yoyo: true, repeat: 3, ease: 'sine.inOut' });
}));
$('#replay').addEventListener('click', e => { e.stopPropagation(); go(1); });

/* ---------- cursor ---------- */
if (matchMedia('(pointer:fine)').matches) {
  const cx = gsap.quickTo('#cur', 'x', { duration: .08 }), cy = gsap.quickTo('#cur', 'y', { duration: .08 });
  const rx = gsap.quickTo('#curRing', 'x', { duration: .45, ease: 'power3' }), ry = gsap.quickTo('#curRing', 'y', { duration: .45, ease: 'power3' });
  addEventListener('pointermove', e => { cx(e.clientX); cy(e.clientY); rx(e.clientX); ry(e.clientY);
    $('#curRing').classList.toggle('big', !!e.target.closest('button,.envelope,.locket,.polaroid')); });
}

/* ---------- boot ---------- */
resize();
const boot = () => { busy = false; go(0); };
(document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(() => setTimeout(boot, 200));
})();
</script>
</body>
</html>
